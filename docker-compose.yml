name: ${COMPOSE_PROJECT_NAME:-cff-playground}

services:
  db:
    image: postgres:16
    # The API and worker are intentionally restartable. The database must be
    # restartable as well, otherwise a Docker/Colima interruption leaves the
    # browser stack in a permanent API restart loop with no `db` hostname.
    restart: unless-stopped
    environment:
      POSTGRES_DB: collegefootballfantasy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Keep PostgreSQL private to this Compose network. The browser-facing
    # application is intentionally served only through the web service.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collegefootballfantasy"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        CFF_GIT_SHA: "${CFF_GIT_SHA:-unknown}"
        CFF_GIT_BRANCH: "${CFF_GIT_BRANCH:-unknown}"
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/collegefootballfantasy
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_LOG_LEVEL: info
      UI_BASE_URL: http://localhost:8080
      PYTHONPATH: /app
      GIT_SHA: "${CFF_GIT_SHA:-unknown}"
      GIT_BRANCH: "${CFF_GIT_BRANCH:-unknown}"
      RUNTIME_ID: "${CFF_RUNTIME_ID:-}"
      # The release launcher marks a dirty-source run as diagnostic and a
      # clean source run as a release candidate. Preserve that provenance in
      # the API process so /health/runtime cannot make a diagnostic browser
      # session look like valid beta-release evidence.
      RUNTIME_MODE: "${CFF_RUNTIME_MODE:-unknown}"
      WEB_GIT_SHA: "${CFF_WEB_GIT_SHA:-unknown}"
      WORKER_GIT_SHA: "${CFF_WORKER_GIT_SHA:-unknown}"
      PLAYER_DATASET_VERSION: "${CFF_PLAYER_DATASET_VERSION:-unknown}"
      PROJECTION_DATASET_VERSION: "${CFF_PROJECTION_DATASET_VERSION:-unknown}"
      CFB27_RATING_DATASET_VERSION: "${CFF_CFB27_RATING_DATASET_VERSION:-unknown}"
      SCORING_MODE: "${SCORING_MODE:-enabled}"
      # Keep this beta compliance flag deploy-configurable. It defaults to
      # false, but a future licensed deployment can opt in without changing
      # the Compose contract or database schema.
      PLAYER_HEADSHOTS_ENABLED: "${PLAYER_HEADSHOTS_ENABLED:-false}"
      BETA_ACCESS_ENABLED: "${BETA_ACCESS_ENABLED:-false}"
      BETA_ACCESS_CODE_HMAC_SECRET: "${BETA_ACCESS_CODE_HMAC_SECRET:-change-me-beta-access-code-hmac}"
      BETA_ACCESS_RESERVATION_SECRET: "${BETA_ACCESS_RESERVATION_SECRET:-change-me-beta-access-reservation}"
      BETA_ACCESS_RESERVATION_TTL_MINUTES: "${BETA_ACCESS_RESERVATION_TTL_MINUTES:-15}"
      BETA_ACCESS_RATE_LIMIT_WINDOW_MINUTES: "${BETA_ACCESS_RATE_LIMIT_WINDOW_MINUTES:-15}"
      BETA_ACCESS_FAILED_EMAIL_LIMIT: "${BETA_ACCESS_FAILED_EMAIL_LIMIT:-5}"
      BETA_ACCESS_FAILED_CODE_LIMIT: "${BETA_ACCESS_FAILED_CODE_LIMIT:-5}"
      BETA_ACCESS_FAILED_IP_LIMIT: "${BETA_ACCESS_FAILED_IP_LIMIT:-10}"
      # The real-stack E2E suite creates three isolated accounts from one container IP.
      # Keep production limits in deployment configuration; this only prevents test setup throttling.
      AUTH_SIGNUP_RATE_LIMIT: 20
      # The local beta is the public-feature acceptance environment. Keep all
      # three flags on here so a published contest cannot be hidden behind a
      # stale local .env value while production retains its explicit deploy
      # configuration.
      SATURDAY_PICK_6_ENABLED: "true"
      SATURDAY_PICK_6_PUBLIC_ENABLED: "true"
      SATURDAY_PICK_6_SPONSORS_ENABLED: "false"
      ESPN_HISTORICAL_STATS_ENABLED: "${ESPN_HISTORICAL_STATS_ENABLED:-true}"
      ESPN_HISTORICAL_STATS_BASE_URL: "${ESPN_HISTORICAL_STATS_BASE_URL:-https://site.web.api.espn.com/apis/common/v3/sports/football/college-football}"
      ESPN_HISTORICAL_STATS_TIMEOUT_SECONDS: "${ESPN_HISTORICAL_STATS_TIMEOUT_SECONDS:-10}"
      ESPN_HISTORICAL_STATS_MAX_RETRIES: "${ESPN_HISTORICAL_STATS_MAX_RETRIES:-3}"
      ESPN_HISTORICAL_STATS_REQUESTS_PER_SECOND: "${ESPN_HISTORICAL_STATS_REQUESTS_PER_SECOND:-1}"
      ESPN_HISTORICAL_STATS_CACHE_TTL_DAYS: "${ESPN_HISTORICAL_STATS_CACHE_TTL_DAYS:-30}"
      ESPN_HISTORICAL_STATS_SEASONS_BACK: "${ESPN_HISTORICAL_STATS_SEASONS_BACK:-4}"
      ESPN_HISTORICAL_STATS_USER_AGENT: "${ESPN_HISTORICAL_STATS_USER_AGENT:-CollegeFootballFantasy/0.1 historical-stats}"
      ESPN_HISTORICAL_STATS_FAIL_OPEN: "${ESPN_HISTORICAL_STATS_FAIL_OPEN:-true}"
    # FastAPI is reached by the web container through Docker DNS (`api:8000`).
    # Do not publish a second browser-facing port alongside the web app.
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "cd /app &&
      PYTHONPATH=/app uv run python scripts/audit_preseason_source_contract.py --source-dir reports/source-imports/2026 &&
      cd api && PYTHONPATH=/app uv run alembic -c alembic.ini upgrade head &&
      cd /app && PYTHONPATH=/app uv run python scripts/bootstrap_canonical_player_data.py --apply &&
      PYTHONPATH=/app uv run python scripts/audit_canonical_player_registry.py --source-dir reports/source-imports/2026 &&
      uv run uvicorn collegefootballfantasy_api.app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        CFF_GIT_SHA: "${CFF_GIT_SHA:-unknown}"
        CFF_GIT_BRANCH: "${CFF_GIT_BRANCH:-unknown}"
        VITE_BETA_ACCESS_ENABLED: "${VITE_BETA_ACCESS_ENABLED:-false}"
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20

  lifecycle_worker:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        CFF_GIT_SHA: "${CFF_GIT_SHA:-unknown}"
        CFF_GIT_BRANCH: "${CFF_GIT_BRANCH:-unknown}"
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/collegefootballfantasy
      PYTHONPATH: /app
      GIT_SHA: "${CFF_GIT_SHA:-unknown}"
      GIT_BRANCH: "${CFF_GIT_BRANCH:-unknown}"
      ESPN_HISTORICAL_STATS_ENABLED: "${ESPN_HISTORICAL_STATS_ENABLED:-true}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: >-
      sh -c "PYTHONPATH=/app uv run python scripts/run_lifecycle_worker.py"

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    profiles: ["e2e"]
    working_dir: /app/web
    environment:
      E2E_BASE_URL: http://web:8080
      REAL_STACK_E2E: "1"
    depends_on:
      web:
        condition: service_started
    command: >-
      npm run test:e2e:real

volumes:
  pgdata:
