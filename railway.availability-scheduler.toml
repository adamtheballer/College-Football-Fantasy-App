[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
# Public conference reports change through the week and shortly before kickoff.
# Poll every 30 minutes in UTC; no paired DST schedule or off-day gap.
cronSchedule = "*/30 * * * *"
startCommand = "cd /app && exec env PYTHONPATH=/app uv run python scripts/sync_official_availability_reports.py --season 2026"
restartPolicyType = "NEVER"
restartPolicyMaxRetries = 1
