version: 1
app: college-football-fantasy

canonical_runtime:
  backend:
    framework: fastapi
    source_dir: api
    import_path: collegefootballfantasy_api.app.main:app
    pythonpath: .
    package_manager: uv
    legacy_backends_disabled:
      - web/server
      - web/netlify/functions/api.ts
      - web/vite.config.server.ts
  frontend:
    framework: vite-react
    source_dir: web
    package_manager: npm
    build_output: web/dist/spa

environments:
  dev:
    description: Local development with Docker Postgres, FastAPI, and Vite.
    database:
      engine: postgres
      docker_service: db
      url_env: DATABASE_URL
      default_url: postgresql+psycopg://postgres:postgres@localhost:5433/collegefootballfantasy
      default_host_port: 5433
      container_port: 5432
    api:
      host: 0.0.0.0
      port: 8000
      migrate_before_start: true
      migrate_command: uv run alembic -c api/alembic.ini upgrade head
      verify_migrations_command: PYTHONPATH=. uv run python scripts/check_alembic_head.py
      start_command: PYTHONPATH=. uv run uvicorn collegefootballfantasy_api.app.main:app --host 0.0.0.0 --port 8000
      health_url: http://localhost:8000/health
      readiness_url: http://localhost:8000/health/ready
    web:
      host: 0.0.0.0
      port: 8080
      install_command: npm --prefix web ci
      start_command: npm --prefix web run dev -- --host 0.0.0.0 --strictPort
      url: http://localhost:8080
      env:
        VITE_API_BASE_URL: /api
        VITE_API_PROXY_TARGET: http://127.0.0.1:8000
    cors_origins:
      - http://localhost:5173
      - http://localhost:8080
    required_env:
      - DATABASE_URL
      - JWT_SECRET_KEY
      - UI_BASE_URL
      - CORS_ORIGINS
    verification:
      - PYTHONPATH=. uv run python -c "from collegefootballfantasy_api.app.main import app; print(app.title)"
      - uv run alembic -c api/alembic.ini upgrade head
      - PYTHONPATH=. uv run pytest -q tests
      - npm --prefix web run typecheck
      - npm --prefix web test
      - npm --prefix web run build

  production:
    description: Managed cloud production deployment. Run migrations before promoting the API.
    release_source:
      canonical_id_owner: application_database_players_id
      source_snapshot_directory: reports/source-imports/2026
      preflight_commands:
        - PYTHONPATH=. uv run python scripts/check_release_source_integrity.py
        - PYTHONPATH=. uv run python scripts/audit_preseason_source_contract.py --source-dir reports/source-imports/2026
      post_migration_commands:
        - PYTHONPATH=. uv run python scripts/bootstrap_canonical_player_data.py --apply
        - PYTHONPATH=. uv run python scripts/audit_canonical_player_registry.py --source-dir reports/source-imports/2026
    database:
      engine: postgres
      managed: true
      url_env: DATABASE_URL
      staging_url_secret: STAGING_DATABASE_URL
      production_url_secret: PRODUCTION_DATABASE_URL
      migrations_before_api: true
      backups_required: true
    api:
      process_type: web
      host: 0.0.0.0
      port_env: API_PORT
      build_command: uv sync --frozen
      migrate_command: cd api && PYTHONPATH=.. uv run alembic -c alembic.ini upgrade head
      verify_migrations_command: PYTHONPATH=. uv run python scripts/check_alembic_head.py
      start_command: PYTHONPATH=. uv run uvicorn collegefootballfantasy_api.app.main:app --host 0.0.0.0 --port ${API_PORT:-8000}
      health_path: /health
      readiness_path: /health/ready
      minimum_replicas: 1
      restart_policy: always
      healthcheck:
        path: /health/ready
        interval_seconds: 10
        failure_threshold: 3
      promotion_order:
        - build_artifact
        - verify_release_source_artifact
        - validate_immutable_player_snapshot
        - run_database_migrations
        - verify_alembic_head
        - bootstrap_canonical_player_registry
        - verify_canonical_player_registry
        - start_or_promote_api
        - require_health_ready
    web:
      process_type: static
      build_command: npm --prefix web ci && npm --prefix web run build
      static_output: web/dist/spa
      env:
        # The Vercel project must route /api/:path* to the always-on API host.
        # Keep the public build on same-origin /api so browser code never embeds
        # an API host or an access-control secret.
        VITE_API_BASE_URL: /api
        VITE_BETA_ACCESS_ENABLED: ${VITE_BETA_ACCESS_ENABLED}
      requires_api_readiness: true
      release_check: curl --fail --show-error --silent ${PUBLIC_API_BASE_URL}/health/ready
    scoring:
      # Public beta intentionally has no live provider polling or scoring processor.
      mode: disabled
      provider_polling: false
      worker_deployed: false
    workers:
      scoring_processor:
        enabled: false
        command: PYTHONPATH=. uv run python scripts/run_scoring_worker.py --season ${SCORING_SEASON} --week ${SCORING_WEEK} --mode live
        note: Omitted for public beta. Enable only with SCORING_MODE=enabled and an approved provider credential.
      lifecycle_processor:
        enabled: true
        command: PYTHONPATH=. uv run python scripts/run_lifecycle_worker.py
        note: Required server-side processor for expired draft picks and due waiver and trade work.
    required_env:
      - DATABASE_URL
      - JWT_SECRET_KEY
      - ENVIRONMENT
      - CORS_ORIGINS
      - UI_BASE_URL
      - PUBLIC_API_BASE_URL
      - VITE_API_BASE_URL
      - BETA_ACCESS_ENABLED
      - BETA_ACCESS_CODE_HMAC_SECRET
      - BETA_ACCESS_RESERVATION_SECRET
      - VITE_BETA_ACCESS_ENABLED
      - REFRESH_COOKIE_SECURE
      - REFRESH_COOKIE_SAMESITE
      - EMAIL_DELIVERY_MODE
      - SMTP_HOST
      - SMTP_FROM_EMAIL
      - SMTP_USE_TLS
      - SUPPORT_EMAIL
      - PRIVACY_POLICY_URL
      - TERMS_URL
      - PROVIDER_DISCLOSURE_URL
      - SCORING_MODE
    optional_env:
      - CORS_ORIGIN_REGEX
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SCORING_PROVIDER
      - SPORTSDATA_API_KEY
      - SPORTSDATA_ENABLED
      - SCORING_SEASON
      - SCORING_WEEK
    safety_gates:
      environment_must_equal: production
      reject_default_jwt_secret: true
      cors_origins_must_be_explicit: true
      cors_origin_regex_must_be_unset_or_production_safe: true
      refresh_cookie_secure_must_be_true: true
      ui_base_url_must_be_non_local_https: true
      email_delivery_must_be_smtp: true
      smtp_tls_must_be_true: true
      sportsdata_credentials_required_when_scoring_enabled: true
      migrations_before_api: true
      verify_alembic_head_before_promotion: true
      require_health_ready_before_traffic: true
      require_public_api_ready_before_web_promotion: true
      no_express_backend: true
      no_localhost_public_urls: true
