version: 1
app: college-football-fantasy

canonical_runtime:
  backend:
    framework: fastapi
    source_dir: api
    import_path: collegefootballfantasy_api.app.main:app
    pythonpath: .
    package_manager: uv
    legacy_backends_disabled:
      - web/server
      - web/netlify/functions/api.ts
      - web/vite.config.server.ts
  frontend:
    framework: vite-react
    source_dir: web
    package_manager: npm
    build_output: web/dist/spa

environments:
  dev:
    description: Local development with Docker Postgres, FastAPI, and Vite.
    database:
      engine: postgres
      docker_service: db
      url_env: DATABASE_URL
      default_url: postgresql+psycopg://postgres:postgres@localhost:5433/collegefootballfantasy
      default_host_port: 5433
      container_port: 5432
    api:
      host: 0.0.0.0
      port: 8000
      migrate_before_start: true
      migrate_command: uv run alembic -c api/alembic.ini upgrade head
      verify_migrations_command: PYTHONPATH=. uv run python scripts/check_alembic_head.py
      start_command: PYTHONPATH=. uv run uvicorn collegefootballfantasy_api.app.main:app --host 0.0.0.0 --port 8000
      health_url: http://localhost:8000/health
      readiness_url: http://localhost:8000/health/ready
    web:
      host: 0.0.0.0
      port: 8080
      install_command: npm --prefix web ci
      start_command: npm --prefix web run dev -- --host 0.0.0.0 --strictPort
      url: http://localhost:8080
      env:
        VITE_API_BASE_URL: /api
        VITE_API_PROXY_TARGET: http://127.0.0.1:8000
    cors_origins:
      - http://localhost:5173
      - http://localhost:8080
    required_env:
      - DATABASE_URL
      - JWT_SECRET_KEY
      - UI_BASE_URL
      - CORS_ORIGINS
    verification:
      - PYTHONPATH=. uv run python -c "from collegefootballfantasy_api.app.main import app; print(app.title)"
      - uv run alembic -c api/alembic.ini upgrade head
      - PYTHONPATH=. uv run pytest -q tests
      - npm --prefix web run typecheck
      - npm --prefix web test
      - npm --prefix web run build

  production:
    description: Managed cloud production deployment. Run migrations before promoting the API.
    release_source:
      canonical_id_owner: application_database_players_id
      source_snapshot_directory: reports/source-imports/2026
      preflight_commands:
        - PYTHONPATH=. uv run python scripts/check_release_source_integrity.py
        - PYTHONPATH=. uv run python scripts/audit_preseason_source_contract.py --source-dir reports/source-imports/2026
      post_migration_commands:
        - PYTHONPATH=. uv run python scripts/audit_canonical_player_registry.py --source-dir reports/source-imports/2026
      manual_data_reconciliation_only:
        # This mutates player data and must be executed in its own approved,
        # transactional release operation; never as an API deploy side effect.
        - PYTHONPATH=. uv run python scripts/bootstrap_canonical_player_data.py --apply
    database:
      engine: postgres
      managed: true
      url_env: DATABASE_URL
      staging_url_secret: STAGING_DATABASE_URL
      production_url_secret: PRODUCTION_DATABASE_URL
      migrations_before_api: true
      backups_required: true
    api:
      process_type: web
      railway_service: College-Football-Fantasy-App API
      railway_root_directory: /
      railway_config_path: /railway.api.toml
      railway_builder: DOCKERFILE
      railway_dockerfile_path: Dockerfile.api
      host: 0.0.0.0
      port_env: PORT
      migrate_command: PYTHONPATH=. uv run alembic -c api/alembic.ini upgrade head
      verify_migrations_command: PYTHONPATH=. uv run python scripts/check_alembic_head.py
      railway_predeploy_command: sh -c 'uv run alembic -c api/alembic.ini upgrade head && uv run python scripts/check_alembic_head.py'
      start_command: sh -c 'exec uv run uvicorn collegefootballfantasy_api.app.main:app --host 0.0.0.0 --port "$PORT"'
      health_path: /health
      readiness_path: /health/ready
      minimum_replicas: 1
      restart_policy: always
      healthcheck:
        path: /health/ready
        interval_seconds: 10
        failure_threshold: 3
      promotion_order:
        - build_artifact
        - verify_release_source_artifact
        - validate_immutable_player_snapshot
        - run_database_migrations
        - verify_alembic_head
        - start_or_promote_api
        - require_health_ready
      cors_origins:
        - https://collegefantasyfootball.org
        - https://www.collegefantasyfootball.org
      ui_base_url: https://www.collegefantasyfootball.org
      public_api_base_url: https://api.collegefantasyfootball.org
    web:
      provider: vercel
      canonical_project: college-football-fantasy-app
      legacy_project_to_disable_manually: college-fantasy-roster
      production_branch: main
      root_directory: web
      process_type: static
      install_command: npm ci
      build_command: test -n "$VERCEL_GIT_COMMIT_SHA" && VITE_GIT_SHA="$VERCEL_GIT_COMMIT_SHA" npm run build
      static_output: dist/spa
      production_url: https://www.collegefantasyfootball.org
      custom_domains:
        - https://collegefantasyfootball.org
        - https://www.collegefantasyfootball.org
      api_proxy_origin: https://api.collegefantasyfootball.org
      required_vercel_system_environment_variables:
        - VERCEL_GIT_COMMIT_SHA
      post_deploy_runtime_proxy_verification: >-
        WEB_RUNTIME_URL=https://www.collegefantasyfootball.org
        DIRECT_API_RUNTIME_URL=https://api.collegefantasyfootball.org
        CFF_GIT_SHA=<release-sha> npm --prefix web run verify:runtime
      env:
        # The Vercel project must route /api/:path* to the always-on API host.
        # Keep the public build on same-origin /api so browser code never embeds
        # an API host or an access-control secret.
        VITE_API_BASE_URL: /api
        VITE_BETA_ACCESS_ENABLED: ${VITE_BETA_ACCESS_ENABLED}
      requires_api_readiness: true
      release_check: curl --fail --show-error --silent ${PUBLIC_API_BASE_URL}/health/ready
    scoring:
      # Public beta intentionally has no live provider polling or scoring processor.
      mode: disabled
      provider_polling: false
      worker_deployed: false
    workers:
      scoring_processor:
        enabled: false
        command: PYTHONPATH=. uv run python scripts/run_espn_scoring_worker.py
        note: Omitted for public beta. Enable only after ESPN shadow validation; the worker resolves verified schedule windows and durable per-game leases itself.
      lifecycle_processor:
        enabled: true
        command: PYTHONPATH=. uv run python scripts/run_lifecycle_worker.py
        note: Required server-side processor for expired draft picks and due waiver and trade work.
      notification_processor:
        enabled: true
        command: PYTHONPATH=. uv run python scripts/run_notification_worker.py
        note: Dedicated durable notification outbox processor. It does not poll live scoring and external delivery remains disabled by default.
    required_env:
      - DATABASE_URL
      - JWT_SECRET_KEY
      - ENVIRONMENT
      - CORS_ORIGINS
      - UI_BASE_URL
      - PUBLIC_API_BASE_URL
      - VITE_API_BASE_URL
      - BETA_ACCESS_ENABLED
      - BETA_ACCESS_CODE_HMAC_SECRET
      - BETA_ACCESS_RESERVATION_SECRET
      - VITE_BETA_ACCESS_ENABLED
      - REFRESH_COOKIE_SECURE
      - REFRESH_COOKIE_SAMESITE
      - EMAIL_ENABLED
      - PUSH_NOTIFICATIONS_ENABLED
      - SCORING_MODE
    optional_env:
      - EMAIL_DELIVERY_MODE
      - PUSH_PROVIDER
      - ONESIGNAL_APP_ID
      - ONESIGNAL_APP_API_KEY
      - VITE_ONESIGNAL_APP_ID
      - RESEND_API_KEY
      - RESEND_FROM
      - NOTIFICATION_WORKER_INTERVAL_SECONDS
      - NOTIFICATION_CLAIM_LEASE_SECONDS
      - NOTIFICATION_MAX_ATTEMPTS
      - LIVE_PLAYER_NOTIFICATIONS_ENABLED
      - CORS_ORIGIN_REGEX
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SUPPORT_EMAIL
      - PRIVACY_POLICY_URL
      - TERMS_URL
      - PROVIDER_DISCLOSURE_URL
      - SCORING_PROVIDER
      - SCORING_WORKER_INTERVAL_LIVE_SECONDS
      - SPORTSDATA_API_KEY
      - SPORTSDATA_ENABLED
      - SCORING_SEASON
      - SCORING_WEEK
    safety_gates:
      environment_must_equal: production
      reject_default_jwt_secret: true
      cors_origins_must_be_explicit: true
      cors_origin_regex_must_be_unset_or_production_safe: true
      refresh_cookie_secure_must_be_true: true
      ui_base_url_must_be_non_local_https: true
      email_disabled_beta_starts_without_smtp: true
      push_disabled_beta_starts_without_onesignal_credentials: true
      sportsdata_credentials_required_when_provider_sportsdata: true
      espn_shadow_requires_explicit_mode: true
      migrations_before_api: true
      verify_alembic_head_before_promotion: true
      require_health_ready_before_traffic: true
      require_public_api_ready_before_web_promotion: true
      no_express_backend: true
      no_localhost_public_urls: true
