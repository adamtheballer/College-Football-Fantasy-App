server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the Compose service name at request time. A static upstream lookup
    # retains the former container IP after an API recreation and leaves the
    # browser-facing /api routes returning 502 until nginx is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    # Keep the browser on one origin. Only the browser-facing /api prefix is
    # removed; FastAPI keeps its native route paths.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA shell must refresh on every browser load; Vite's fingerprinted
    # assets can safely stay cached. This prevents a browser from retaining an
    # old API contract after a beta release restart.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Apple requires this extensionless Universal Links association document
    # to be served as JSON, never through the SPA fallback.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Let React Router own client-side paths after the initial document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
