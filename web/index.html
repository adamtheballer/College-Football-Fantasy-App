<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Capacitor renders beneath the iPhone status bar. `viewport-fit=cover`
      exposes the native safe-area insets so the shared app shell can reserve
      that space for every route instead of letting the first header render
      behind the system UI.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Use versioned icon URLs. Safari caches home-screen icons aggressively by
      path, so reusing an icon filename can leave an older app badge in place
      even after a successful web deployment.
    -->
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/cffb-app-icon-v2-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/cffb-app-icon-v2-180.png" />
    <title>College Fantasy Football</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
