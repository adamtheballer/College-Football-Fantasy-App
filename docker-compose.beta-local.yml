# The only supported public-beta override.  It deliberately reuses a named,
# pre-existing database volume instead of letting Compose create a blank
# project-scoped volume for a second copy of the application.
name: cff_beta

services:
  db:
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    environment:
      UI_BASE_URL: "http://127.0.0.1:18080"
      # The public beta intentionally ships without live scoring. Keep this
      # explicit so a restart cannot inherit the development Compose defaults.
      SCORING_MODE: "disabled"
      BETA_SCORING_LOCK_ENABLED: "true"
      SPORTSDATA_ENABLED: "false"
      SATURDAY_PICK_6_SPONSORS_ENABLED: "${SATURDAY_PICK_6_SPONSORS_ENABLED:-false}"
      GIT_SHA: "${CFF_GIT_SHA:?CFF_GIT_SHA is required}"
      GIT_BRANCH: "${CFF_GIT_BRANCH:?CFF_GIT_BRANCH is required}"
      RUNTIME_MODE: "release_candidate"
      RUNTIME_ID: "${CFF_RUNTIME_ID:?CFF_RUNTIME_ID is required}"
      WEB_GIT_SHA: "${CFF_WEB_GIT_SHA:?CFF_WEB_GIT_SHA is required}"
      WORKER_GIT_SHA: "${CFF_WORKER_GIT_SHA:?CFF_WORKER_GIT_SHA is required}"
      PLAYER_DATASET_VERSION: "${CFF_PLAYER_DATASET_VERSION:?CFF_PLAYER_DATASET_VERSION is required}"
      PROJECTION_DATASET_VERSION: "${CFF_PROJECTION_DATASET_VERSION:?CFF_PROJECTION_DATASET_VERSION is required}"
      CFB27_RATING_DATASET_VERSION: "${CFF_CFB27_RATING_DATASET_VERSION:?CFB27_RATING_DATASET_VERSION is required}"
  lifecycle_worker:
    environment:
      GIT_SHA: "${CFF_GIT_SHA:?CFF_GIT_SHA is required}"
      GIT_BRANCH: "${CFF_GIT_BRANCH:?CFF_GIT_BRANCH is required}"
      RUNTIME_MODE: "release_candidate"
  web:
    # Compose appends sequence values by default. The beta override must
    # replace the base 8080 mapping rather than exposing both ports.
    ports: !override
      - "127.0.0.1:18080:8080"
volumes:
  pgdata:
    external: true
    name: "cff_beta_pgdata"
